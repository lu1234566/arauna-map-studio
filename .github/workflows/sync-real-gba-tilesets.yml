name: Generate real GBA tilesets

on:
  push:
    branches:
      - agent/real-gba-tilesets
    paths:
      - scripts/sync_gba_tilesets.py
      - .github/workflows/sync-real-gba-tilesets.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/sync_gba_tilesets.py
      - src/lib/gbaTilesetLibrary.ts
      - src/lib/realAtlasStore.ts
      - src/lib/demoAtlas.ts
      - src/components/studio/TilePalette.tsx
      - src/routes/tilesets.tsx
      - .github/workflows/sync-real-gba-tilesets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-gba-tilesets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install atlas generator dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate pixel-perfect Gen III atlases
        run: python scripts/sync_gba_tilesets.py

      - name: Verify generated catalog
        run: |
          test -s public/gba/catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("public/gba/catalog.json").read_text())
          assert catalog["format"] == "arauna-gba-tileset-catalog-v1"
          assert catalog["defaultPackId"] == "emerald:general:petalburg"
          assert any(p["id"] == catalog["defaultPackId"] for p in catalog["packs"])
          assert {p["family"] for p in catalog["packs"]} == {"emerald", "ruby-sapphire", "firered-leafgreen"}
          assert not catalog["unresolvedPairs"], catalog["unresolvedPairs"]
          for pack in catalog["packs"]:
              path = Path("public") / pack["atlasUrl"].lstrip("/")
              assert path.is_file() and path.stat().st_size > 0, path
          print("families:", len(catalog["families"]))
          print("packs:", len(catalog["packs"]))
          print("metatiles:", sum(p["primaryCount"] + p["secondaryCount"] for p in catalog["packs"]))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production preview
        run: npm run build

      - name: Commit generated library
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain public/gba)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/gba
            git commit -m "Generate real GBA tileset library"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Generated GBA library already up to date."
          fi
